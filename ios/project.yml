name: Forx
options:
  bundleIdPrefix: com.milanpatel
  deploymentTarget: { iOS: "26.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Forx:
    type: application
    platform: iOS
    sources:
      - path: Forx
        excludes: ["Web"]
      - path: Forx/Web
        type: folder
    info:
      path: Forx/Info.plist
      properties:
        CFBundleDisplayName: Forx
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.milanpatel.Forx.refresh]
        NSFaceIDUsageDescription: "Face ID confirms it's you before unlocking the Jeep."
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milanpatel.Forx
  ForxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ForxTests
        excludes: ["Fixtures"]
      - path: ForxTests/Fixtures
        type: folder
    dependencies:
      - target: Forx
schemes:
  Forx:
    build:
      targets:
        Forx: all
    test:
      targets: [ForxTests]
