  <title>Jeep</title>
  <style>
    /* transparent page: the CarPlay panel's colour shows through */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; }
    /* feathered on all four sides: the floor and its reflection fade out, never a hard rectangle */
    canvas {
      display: block; width: 100%; height: 100%; pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 6%, #000 88%, transparent 100%),
                          linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(to bottom, transparent 0, #000 6%, #000 88%, transparent 100%),
                  linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%);
      mask-composite: intersect;
    }

  </style>
