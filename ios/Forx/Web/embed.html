<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Jeep</title>
  <style>
    /* transparent page: the CarPlay window's colour shows through */
    :root {
      --ink: #F5F5F7; --ink-2: rgba(245,245,247,.55); --line: rgba(245,245,247,.38);
      --amber: #FF9F0A; --bolt: rgba(245,245,247,.62);
      /* the roof strip: night has a mid-grey handle on lighter dots; day the reverse */
      --bg: #000; --dot: rgba(245,245,247,.34); --handle: #9A9A9F; --handle-shadow: rgba(0,0,0,.5);
      color: var(--ink);
      font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    }
    [data-theme=light] {
      --ink: #1C1C1E; --ink-2: rgba(28,28,30,.55); --line: rgba(28,28,30,.34); --bolt: rgba(28,28,30,.55);
      --bg: #F5F5F7; --dot: rgba(28,28,30,.36); --handle: #B0B0B5; --handle-shadow: rgba(0,0,0,.16);
    }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; }
    /* feathered on all four sides: the floor and its reflection fade out, never a hard rectangle */
    canvas {
      display: block; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity .7s ease;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 5%, #000 90%, transparent 100%),
                          linear-gradient(to right, transparent 0, #000 4%, #000 96%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(to bottom, transparent 0, #000 5%, #000 90%, transparent 100%),
                  linear-gradient(to right, transparent 0, #000 4%, #000 96%, transparent 100%);
      mask-composite: intersect;
    }
    html[data-ready] canvas { opacity: 1; }

    /* the overlay: call-outs, the roof strip, the tire labels; all pinned from the 3D anchors */
    #ui { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    #lines line { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; shape-rendering: crispEdges; }
    .co, .tire, #strip { position: absolute; transition: opacity .3s ease; }
    .co { font-size: 10px; line-height: 12px; letter-spacing: .01em; white-space: nowrap; }
    .co small { display: block; font-weight: 500; color: var(--ink-2); font-size: 10px; }
    .co b { display: block; font-weight: 700; }
    .co.right { text-align: left; }
    .co.left { text-align: right; }
    .co svg { display: block; width: 16px; height: 16px; }
    .co.lock { color: var(--ink-2); }
    .co.lock.open { color: var(--amber); }
    .co.charge { color: var(--ink); }
    .co.charge svg { width: 14px; height: 14px; color: var(--bolt); margin-bottom: 1px; }
    .co.charge.left svg { margin-left: auto; }
    .hide { opacity: 0 !important; }

    /* the roof strip: a dotted track with a spring handle (the Jeep's top view) resting in its middle */
    #strip { width: 48px; }
    #strip .dots {
      position: absolute; left: 50%; top: 10px; bottom: 10px; transform: translateX(-50%); width: 44px;
      background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.4px); background-size: 11px 11px;
    }
    /* the handle follows the finger as is, then springs home (no bounce) in 350 ms */
    #strip .thumb { position: absolute; left: 50%; width: 26px; height: 42px; transform: translate(-50%, -50%); transition: top .35s cubic-bezier(.2, .85, .25, 1); }
    #strip[data-drag] .thumb, #strip.still .thumb { transition: none; }
    /* a backing in the page's colour hides the dots behind the handle's cut-outs */
    #strip .thumb .back { position: absolute; inset: -5px -8px; border-radius: 10px; background: var(--bg); }
    #strip .thumb .glyph { position: absolute; inset: 0; filter: drop-shadow(0 1px 2px var(--handle-shadow)); }
    #strip .thumb .icon {
      position: absolute; inset: 0; background: var(--handle);
      -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center;
    }

    /* tires: the four pressures beside the wheels, "x minutes ago" under each */
    .tire { transform: translateY(-50%); white-space: nowrap; }
    .tire b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; line-height: 26px; }
    .tire b i { font-style: normal; font-weight: 500; font-size: 15px; letter-spacing: 0; margin-left: 3px; }
    .tire small { display: block; font-size: 11px; font-weight: 500; color: var(--ink-2); line-height: 14px; }
    .tire.left { text-align: right; }
  </style>
  <script type="module" crossorigin src="./assets/embed-D5CA4v3q.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/jeep-DXxGYh3z.js">
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <svg id="lines" aria-hidden="true"></svg>
    <div id="strip" class="hide">
      <div class="dots"></div><div class="thumb"><div class="back"></div><div class="glyph"><div class="icon"></div></div></div>
    </div>
  </div>
</body>
</html>
