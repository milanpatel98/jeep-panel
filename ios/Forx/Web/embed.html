<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Jeep</title>
  <style>
    /* transparent page: the CarPlay panel's colour shows through */
    :root {
      --dot: rgba(255, 255, 255, .18);
      --puck: rgba(28, 28, 30, .92);
      --puck-edge: rgba(255, 255, 255, .16);
      --puck-shadow: 0 6px 16px rgba(0, 0, 0, .6);
      --glyph: #F5F5F7;
      --label: #F5F5F7;
    }
    :root[data-theme="light"] {
      --dot: rgba(0, 0, 0, .14);
      --puck: #FFFFFF;
      --puck-edge: rgba(0, 0, 0, .08);
      --puck-shadow: 0 4px 12px rgba(0, 0, 0, .12);
      --glyph: #1C1C1E;
      --label: #1C1C1E;
    }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; }
    /* feathered on all four sides: the floor and its reflection fade out, never a hard rectangle */
    canvas {
      display: block; width: 100%; height: 100%; pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 6%, #000 88%, transparent 100%),
                          linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(to bottom, transparent 0, #000 6%, #000 88%, transparent 100%),
                  linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%);
      mask-composite: intersect;
    }

    /* the roof strip hugs the Jeep's right side: its centre 22 px in from the edge, from 12% to 82%
       of the height. The dotted track is exactly the thumb's travel: the puck's centre sits on its
       first dot at "Top on" and on its last at "Doors off". */
    #strip {
      --puck-h: 42px;
      position: absolute; right: 0; width: 44px; top: 12%; height: 70%;
      pointer-events: none;
      font: 600 10px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    #strip .track {
      /* two columns of dots, spaced so the first and last dot centres land on the track's ends */
      position: absolute; left: 50%; width: 12px; top: -3px; bottom: -3px; transform: translateX(-50%);
      background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.3px);
      background-size: 6px 6px; background-repeat: space;
      transition: background-image 300ms ease;
    }
    #strip .thumb {
      position: absolute; left: 0; right: 0; top: 0;
      transform: translateY(calc(var(--pos, 0) * 70vh - var(--puck-h) / 2));
      transition: transform 460ms cubic-bezier(.34, 1.32, .64, 1);   /* snaps with a little spring */
      will-change: transform;
    }
    #strip.live .thumb, .reduce #strip .thumb { transition: none; }   /* 1:1 with the finger */
    #puck {
      width: 30px; height: var(--puck-h); margin: 0 auto; border-radius: 10px;
      display: grid; place-items: center; color: var(--glyph); background: var(--puck);
      box-shadow: inset 0 0 0 1px var(--puck-edge), var(--puck-shadow);
      transition: background-color 300ms ease, color 300ms ease, box-shadow 300ms ease;
    }
    #puck svg { width: 18px; height: 32px; display: block; }
    #strip-label {
      position: absolute; left: 50%; top: calc(var(--puck-h) + 4px); transform: translateX(-50%);
      white-space: nowrap; color: var(--label); letter-spacing: -.01em; transition: color 300ms ease;
    }
  </style>
  <script type="module" crossorigin src="./assets/embed-C_RbLqRH.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/jeep-CDNWbL8X.js">
</head>
<body>
  <canvas id="c"></canvas>
  <div id="strip" aria-hidden="true">
    <div class="track"></div>
    <div class="thumb"><div id="puck"></div><div id="strip-label"></div></div>
  </div>
</body>
</html>
