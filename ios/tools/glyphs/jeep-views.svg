<svg width="28" height="28" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <!-- Forx map button: the Jeep's front view (Milan's top-view icon style: a filled body, details cut out) -->
  <g id="body" fill="#fff">
    <!-- windshield frame -->
    <path d="M8.4 4.8h11.2a1.4 1.4 0 0 1 1.3.9l2 4.9H5.1l2-4.9a1.4 1.4 0 0 1 1.3-.9z"/>
    <!-- body -->
    <path d="M4.6 10.6h18.8v10.6a1.2 1.2 0 0 1-1.2 1.2H5.8a1.2 1.2 0 0 1-1.2-1.2z"/>
    <!-- fenders -->
    <rect x="1.2" y="12.2" width="3.8" height="3.6" rx="1.2"/>
    <rect x="23" y="12.2" width="3.8" height="3.6" rx="1.2"/>
    <!-- bumper -->
    <rect x="2.4" y="19.6" width="23.2" height="3.3" rx="1.2"/>
    <!-- tyres -->
    <rect x="4.4" y="22.2" width="4.8" height="2.4" rx="0.9"/>
    <rect x="18.8" y="22.2" width="4.8" height="2.4" rx="0.9"/>
  </g>
  <g id="cut" fill="#000" stroke="#000">
    <!-- windshield -->
    <path d="M9.5 6.6h9l1.3 3.1H8.2z"/>
    <!-- the line under the hood -->
    <rect x="4.6" y="11.1" width="18.8" height="1"/>
    <!-- headlights -->
    <circle cx="7.9" cy="16.1" r="1.8"/>
    <circle cx="20.1" cy="16.1" r="1.8"/>
    <!-- the grille's slots -->
    <rect x="11.3" y="13.4" width="1.2" height="5.4" rx="0.5"/>
    <rect x="13.4" y="13.4" width="1.2" height="5.4" rx="0.5"/>
    <rect x="15.5" y="13.4" width="1.2" height="5.4" rx="0.5"/>
  </g>
</svg>
